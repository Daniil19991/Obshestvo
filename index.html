var termUI = { q:"", mod:"", mode:"list", onlyNew:false, deck:null, pos:0, flip:false };
function allTerms(){
  var out=[];
  TERMS.forEach(function(t,i){ var k="b"+i; if(S.terms.hidden[k]) return; var e=S.terms.edit[k]; out.push({ key:k, t:e?e.t:t.t, d:e?e.d:t.d, m:e?e.m:t.m, own:false }); });
  S.terms.added.forEach(function(t){ out.push({ key:t.id, t:t.t, d:t.d, m:t.m, own:true }); });
  return out;
}
function termMods(){ return SUBJECTS.obsh.modules; }
function renderTerms(root){
  root=freshRoot();
  var list=allTerms(), u=termUI;
  var q=u.q.trim().toLowerCase();
  var f=list.filter(function(t){
    if(u.mod && t.m!==u.mod) return false;
    if(u.onlyNew && S.terms.known[t.key]) return false;
    if(q && (t.t+" "+t.d).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  var known=list.filter(function(t){return S.terms.known[t.key];}).length;
  var html='<header class="panel hero"><div class="eyebrow">Обществознание · словарь</div><h1>Понятия</h1>'+
    '<p class="sub">'+list.length+' '+plural(list.length,"понятие","понятия","понятий")+', из них выучено '+known+'. Ищи, фильтруй по модулю, учи карточками и добавляй новые.</p>'+
    '<div class="bar" style="max-width:420px"><i style="width:'+(list.length?Math.round(known/list.length*100):0)+'%"></i></div></header>';
  html+='<section class="section"><div class="tools">'+
    '<div class="seg"><button data-tmode="list" class="'+(u.mode==="list"?"on":"")+'">Список</button><button data-tmode="cards" class="'+(u.mode==="cards"?"on":"")+'">Карточки</button></div>'+
    '<input type="search" id="tq" placeholder="Поиск: «инфляция», «право»…" value="'+esc(u.q)+'" aria-label="Поиск понятия">'+
    '<select id="tm" aria-label="Модуль"><option value="">Все модули</option>'+termMods().map(function(m){ var c=list.filter(function(t){return t.m===m.id;}).length; return '<option value="'+m.id+'"'+(u.mod===m.id?' selected':'')+'>'+m.name+' ('+c+')</option>'; }).join("")+'</select>'+
    '<label class="chk"><input type="checkbox" id="tnew"'+(u.onlyNew?' checked':'')+'> только невыученные</label>'+
    '<button class="btn" data-addterm>+ Понятие</button></div>';
  if(u.mode==="list"){
    html+='<div class="panel pad"><div class="terms">';
    if(!f.length) html+='<p class="empty">Ничего не нашлось.</p>';
    f.slice(0,400).forEach(function(t){
      var m=SUBJECTS.obsh.modules.filter(function(x){return x.id===t.m;})[0];
      html+='<div class="term'+(S.terms.known[t.key]?' known':'')+'"><span class="tt">'+hl(t.t,q)+(m?'<span class="modchip" style="--m:'+col(m)+'"><i></i>'+m.name+'</span>':'')+(t.own?' <span class="tag m">добавлено</span>':'')+'</span>'+
        '<span class="ta"><button class="iconbtn" data-known="'+t.key+'" title="'+(S.terms.known[t.key]?'Снять отметку':'Выучено')+'" aria-label="Выучено" style="'+(S.terms.known[t.key]?'color:var(--ok)':'')+'">'+(S.terms.known[t.key]?'★':'☆')+'</button><button class="iconbtn" data-editterm="'+t.key+'" title="Изменить" aria-label="Изменить">✎</button></span>'+
        '<span class="td">'+hl(t.d,q)+'</span></div>';
    });
    html+='</div>'+(f.length>400?'<p class="note">Показаны первые 400 — уточни поиск.</p>':'')+'</div>';
  } else {
    var key=f.map(function(t){return t.key;}).join("|");
    if(!u.deck || u.deckKey!==key){ u.deck=shuffle(f.map(function(t){return t.key;})); u.deckKey=key; u.pos=0; u.flip=false; }
    var cur = u.deck.length ? list.filter(function(t){return t.key===u.deck[u.pos % u.deck.length];})[0] : null;
    if(!cur) html+='<div class="panel flash"><p class="fh">Карточек нет — смени фильтр.</p></div>';
    else {
      html+='<div class="panel flash" data-flip><span class="eyebrow">'+((u.pos%u.deck.length)+1)+' из '+u.deck.length+'</span><div class="ft">'+esc(cur.t)+'</div>'+
        (u.flip?'<div class="fd">'+esc(cur.d)+'</div>':'<div class="fh">вспомни определение и нажми на карточку</div>')+'</div>'+
        '<div class="fctl"><button class="btn ghost" data-fnext="0">Ещё повторю</button><button class="btn" data-fnext="1">★ Знаю</button></div>';
    }
  }
  html+='</section>'+footer();
  root.innerHTML=html;
  setNav([]);
  bindTerms(root);
}
function hl(s, q){ var e=esc(s); if(!q) return e; var i=s.toLowerCase().indexOf(q); if(i<0) return e; return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length)); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function bindTerms(root){
  var u=termUI;
  var tq=$("#tq");
  tq.addEventListener("input", function(){ u.q=tq.value; var pos=tq.selectionStart; renderTerms($("#app")); var n=$("#tq"); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} });
  $("#tm").addEventListener("change", function(){ u.mod=this.value; renderTerms($("#app")); });
  $("#tnew").addEventListener("change", function(){ u.onlyNew=this.checked; renderTerms($("#app")); });
  root.addEventListener("click", function(e){
    var el;
    if((el=e.target.closest("[data-tmode]"))){ u.mode=el.getAttribute("data-tmode"); return renderTerms($("#app")); }
    if((el=e.target.closest("[data-known]"))){ var k=el.getAttribute("data-known"); if(S.terms.known[k]) delete S.terms.known[k]; else S.terms.known[k]=today(); save(); var y=window.scrollY; renderTerms($("#app")); window.scrollTo(0,y); return; }
    if(e.target.closest("[data-flip]")){ u.flip=!u.flip; return renderTerms($("#app")); }
    if((el=e.target.closest("[data-fnext]"))){
      var cur=u.deck[u.pos%u.deck.length];
      if(el.getAttribute("data-fnext")==="1"){ S.terms.known[cur]=today(); save(); if(u.onlyNew){ u.deckKey=null; } }
      u.pos++; u.flip=false; return renderTerms($("#app"));
    }
    if(e.target.closest("[data-addterm]")) return termModal(null);
    if((el=e.target.closest("[data-editterm]"))) return termModal(el.getAttribute("data-editterm"));
  });
}
function termModal(key){
  var t = key ? allTerms().filter(function(x){return x.key===key;})[0] : { t:"", d:"", m:termUI.mod||"chio", own:true };
  var isNew=!key;
  openModal('<div class="mh"><h2>'+(isNew?'Новое понятие':'Изменить понятие')+'</h2><button class="iconbtn" data-close aria-label="Закрыть">✕</button></div>'+
    '<form id="tf" style="display:flex;flex-direction:column;gap:12px">'+
    '<div class="field"><label for="tT">Понятие</label><input type="text" id="tT" required value="'+esc(t.t)+'"></div>'+
    '<div class="field"><label for="tD">Определение</label><textarea id="tD" required style="min-height:110px">'+esc(t.d)+'</textarea></div>'+
    '<div class="field"><label for="tM">Модуль</label><select id="tM">'+termMods().map(function(m){return '<option value="'+m.id+'"'+(m.id===t.m?' selected':'')+'>'+m.name+'</option>';}).join("")+'</select></div>'+
    '<div class="mfoot">'+(!isNew?'<button type="button" class="btn danger" id="tDel">Удалить</button>':'')+(!isNew&&!t.own&&S.terms.edit[key]?'<button type="button" class="btn ghost" id="tRes">Вернуть исходное</button>':'')+
    '<span class="sp"></span><button type="button" class="btn ghost" data-close>Отмена</button><button class="btn">Сохранить</button></div></form>',
  function(box){
    box.addEventListener("click", function(e){
      if(e.target.closest("[data-close]")) closeModal();
      if(e.target.id==="tDel" && confirm("Удалить понятие «"+t.t+"»?")){
        if(t.own) S.terms.added=S.terms.added.filter(function(x){return x.id!==key;}); else S.terms.hidden[key]=1;
        save(); closeModal(); renderTerms($("#app"));
      }
      if(e.target.id==="tRes"){ delete S.terms.edit[key]; save(); closeModal(); renderTerms($("#app")); }
    });
    $("#tf").addEventListener("submit", function(e){
      e.preventDefault();
      var n={ t:$("#tT").value.trim(), d:$("#tD").value.trim(), m:$("#tM").value }; if(!n.t||!n.d) return;
      if(isNew){ n.id="u"+uid(); S.terms.added.push(n); }
      else if(t.own){ var a=S.terms.added.filter(function(x){return x.id===key;})[0]; a.t=n.t; a.d=n.d; a.m=n.m; }
      else S.terms.edit[key]=n;
      save(); closeModal(); var y=window.scrollY; renderTerms($("#app")); window.scrollTo(0,y); toast(isNew?"Понятие добавлено":"Сохранено");
    });
  });
}

}
document.addEventListener("click", function(e){
  if(e.target.closest("[data-export]")){
    var blob=new Blob([JSON.stringify(S,null,1)], {type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="celi-kopiya-"+today()+".json";
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast("Копия сохранена в загрузки");
  }
  var sn=e.target.closest("[data-scroll]");
  if(sn){ e.preventDefault(); var el=document.getElementById(sn.getAttribute("data-scroll")); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); }
});
document.addEventListener("change", function(e){
  if(!e.target.matches("[data-import]")) return;
  var file=e.target.files[0]; if(!file) return;
  var rd=new FileReader();
  rd.onload=function(){
    try {
      var o=JSON.parse(rd.result);
      if(!o || typeof o!=="object" || !o.tutor || !o.subj) throw new Error("не похоже на копию с этого сайта");
      if(!confirm("Заменить все данные в этом браузере данными из файла?")) return;
      S=o; normalize(); save(); route(); toast("Копия загружена");
    } catch(err){ toast("Не получилось: "+err.message); }
  };
  rd.readAsText(file);
  e.target.value="";
});

function setNav(items){
  var sub=$("#subnav");
  sub.innerHTML=items.map(function(it){ return '<a href="#" data-scroll="'+it[0]+'">'+it[1]+'</a>'; }).join("");
}

load();
route();
var rT; window.addEventListener("resize", function(){ clearTimeout(rT); rT=setTimeout(function(){ if(/^#\/s\//.test(location.hash)) { var st=subjStudent(location.hash.split("/")[2]); if(st){ scoreChart(st, SUBJECTS[st.subject], checkpoints(st), S.subj[st.id].results.filter(function(r){return r.fmt!=="module"&&r.kind!=="module";}).sort(function(a,b){return a.date<b.date?-1:1;})); topicsChart(st, topicPlan(st)); } } }, 200); });
if(window.matchMedia) try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", route); } catch(e){}
})();
