<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Цели и прогресс</title>
<meta name="description" content="Цели учеников: тьюторство, обществознание, история">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233F7A5F'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Commissioner:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1EA; --surface:#FFFDF9; --surface2:#EFE8DE; --border:#E4DACB; --border2:#CDBFAB;
  --ink:#231D17; --ink2:#554B40; --muted:#877B6D;
  --ok:#4E6B34; --ok-soft:#E4ECD6; --bad:#A4412E; --bad-soft:#F6DFD8;
  --warn:#8F5E12; --warn-soft:#F7E8CB;
  --c-tutor:#3F7A5F; --c-obsh:#7A3452; --c-hist:#9A4A24;
  --dir:#3F7A5F; --dir-soft:#E2EEE7;
  --shadow:0 1px 2px rgba(60,40,20,.06), 0 8px 24px -14px rgba(60,40,20,.25);
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Commissioner","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130F; --surface:#201B16; --surface2:#2A241D; --border:#382F26; --border2:#4E4335;
    --ink:#F1E9DF; --ink2:#CDBFAE; --muted:#9A8C7C;
    --ok:#9DBE72; --ok-soft:#242C1A; --bad:#E58A74; --bad-soft:#35201A;
    --warn:#E0AC5A; --warn-soft:#33260F;
    --c-tutor:#6FC3A0; --c-obsh:#D08AA8; --c-hist:#E0956A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16130F; --surface:#201B16; --surface2:#2A241D; --border:#382F26; --border2:#4E4335;
  --ink:#F1E9DF; --ink2:#CDBFAE; --muted:#9A8C7C;
  --ok:#9DBE72; --ok-soft:#242C1A; --bad:#E58A74; --bad-soft:#35201A;
  --warn:#E0AC5A; --warn-soft:#33260F;
  --c-tutor:#6FC3A0; --c-obsh:#D08AA8; --c-hist:#E0956A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
body.d-tutor{--dir:var(--c-tutor)}
body.d-obsh{--dir:var(--c-obsh)}
body.d-hist{--dir:var(--c-hist)}
body{--dir-soft:color-mix(in srgb, var(--dir) 14%, var(--surface))}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; overflow-x:hidden}
h1,h2,h3{font-family:var(--serif); margin:0; font-weight:600; letter-spacing:-.01em; text-wrap:balance}
h1{font-size:clamp(26px,5vw,38px); line-height:1.15}
h2{font-size:clamp(19px,2.6vw,23px); line-height:1.25}
h3{font-size:16px; line-height:1.3}
p{margin:0}
button{font:inherit; color:inherit}
a{color:inherit}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}

/* ---------- шапка ---------- */
.topnav{position:sticky; top:0; z-index:30; background:var(--bg);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px); -webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--border)}
.topnav-in{max-width:1080px; margin:0 auto; padding:0 20px; height:54px; display:flex; align-items:center; gap:14px}
.brand{font-family:var(--serif); font-size:16px; font-weight:600; text-decoration:none; white-space:nowrap; display:flex; align-items:center; gap:9px}
.brand i{width:22px; height:22px; border-radius:7px; background:var(--dir); display:inline-block; position:relative}
.brand i::after{content:""; position:absolute; inset:6px; border:2px solid var(--surface); border-radius:50%}
.navlinks{display:flex; gap:2px; margin-left:auto; overflow-x:auto; scrollbar-width:none}
.navlinks::-webkit-scrollbar{display:none}
.navlinks a{color:var(--muted); text-decoration:none; font-size:14px; white-space:nowrap; padding:7px 11px; border-radius:8px}
.navlinks a.on{color:var(--ink); background:var(--surface2); font-weight:600}
@media (hover:hover){ .navlinks a:hover{color:var(--ink); background:var(--surface2)} }
@media (max-width:620px){ #subnav{display:none} .brand span{display:none} .topnav-in{padding:0 12px; gap:8px} .navlinks a{padding:8px 10px} }

.wrap{max-width:1080px; margin:0 auto; padding:24px 20px 80px; display:flex; flex-direction:column; gap:32px}
@media (max-width:620px){ .wrap{padding:18px 16px 64px; gap:26px} }

.section{display:flex; flex-direction:column; gap:14px; scroll-margin-top:70px}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap}
.note{font-size:13px; color:var(--muted)}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow)}
.pad{padding:20px 22px}
@media (max-width:620px){ .pad{padding:16px} }

/* ---------- кнопки и поля ---------- */
.btn{font-weight:500; font-size:14px; padding:8px 15px; border-radius:9px; background:var(--dir); color:var(--surface);
  border:1px solid transparent; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.btn.ghost{background:none; color:var(--ink2); border-color:var(--border)}
.btn.small{padding:5px 10px; font-size:13px}
.btn.danger{background:none; color:var(--bad); border-color:var(--bad-soft)}
@media (hover:hover){ .btn:hover{filter:brightness(1.1)} .btn.ghost:hover{background:var(--surface2); filter:none} }
.btn:active{filter:brightness(.94)}
.iconbtn{background:none; border:1px solid transparent; border-radius:8px; width:32px; height:32px; cursor:pointer; color:var(--muted);
  display:inline-flex; align-items:center; justify-content:center; font-size:15px; flex:none}
@media (hover:hover){ .iconbtn:hover{background:var(--surface2); color:var(--ink)} }
.field{display:flex; flex-direction:column; gap:5px; min-width:0}
.field>label{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
  font:inherit; font-size:15px; padding:8px 10px; border:1px solid var(--border); border-radius:9px;
  background:var(--surface); color:var(--ink); width:100%; min-width:0}
textarea{resize:vertical; min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--dir); outline-offset:-1px; border-color:transparent}
@media (max-width:620px){ input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{font-size:16px} }
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}
.row>.field{flex:1 1 130px}
.chk{display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:14px}

/* ---------- главная ---------- */
.hero{padding:26px 26px 24px; display:flex; flex-direction:column; gap:10px}
.hero .sub{color:var(--ink2); max-width:62ch}
.dirs{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
@media (max-width:860px){ .dirs{grid-template-columns:1fr} }
.dir{--d:var(--c-tutor); padding:18px 18px 14px; display:flex; flex-direction:column; gap:12px; border-top:4px solid var(--d)}
.dir.obsh{--d:var(--c-obsh)} .dir.hist{--d:var(--c-hist)}
.dir h2{display:flex; align-items:center; gap:10px}
.dir h2 b{font-family:var(--mono); font-size:12px; color:var(--d); font-weight:600; letter-spacing:.08em}
.stlist{display:flex; flex-direction:column}
.st{display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; padding:10px 8px; border-radius:10px; text-decoration:none}
.st+.st{border-top:1px solid var(--border)}
@media (hover:hover){ .st:hover{background:var(--surface2)} }
.st .nm{font-weight:600}
.st .gr{font-size:12.5px; color:var(--muted)}
.st .pc{font-family:var(--mono); font-size:13px; font-weight:600; color:var(--d)}
.st .bar{grid-column:1/-1}
.bar{height:6px; border-radius:4px; background:var(--surface2); overflow:hidden}
.bar>i{display:block; height:100%; background:var(--d, var(--dir)); border-radius:4px; transition:width .3s ease}
.upcoming{display:flex; flex-direction:column}
.up{display:grid; grid-template-columns:86px 1fr auto; gap:12px; padding:10px 4px; align-items:baseline; text-decoration:none}
.up+.up{border-top:1px solid var(--border)}
.up .dt{font-family:var(--mono); font-size:12.5px; color:var(--muted)}
.up .who{font-size:13px; color:var(--muted); white-space:nowrap}
.tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:5px;
  background:var(--surface2); color:var(--ink2); white-space:nowrap; display:inline-block}
.tag.q{background:var(--warn-soft); color:var(--warn)}
.tag.m{background:var(--dir-soft); color:var(--dir)}
.tag.ok{background:var(--ok-soft); color:var(--ok)}
.tag.bad{background:var(--bad-soft); color:var(--bad)}
@media (max-width:620px){ .up{grid-template-columns:70px 1fr} .up .who{grid-column:2} }

/* ---------- страница ученика: шапка ---------- */
.shead{display:grid; grid-template-columns:1.5fr 1fr; gap:16px}
@media (max-width:760px){ .shead{grid-template-columns:1fr} }
.shead .main{padding:22px 24px; display:flex; flex-direction:column; gap:12px}
.goaltext{color:var(--ink2); font-size:15px; max-width:64ch}
.countdown{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap}
.cd-num{font-family:var(--mono); font-weight:600; font-size:clamp(34px,6vw,48px); line-height:.95; letter-spacing:-.03em; color:var(--warn)}
.cd-cap{font-size:13px; color:var(--muted); padding-bottom:4px}
.ringbox{padding:18px; display:flex; align-items:center; justify-content:center; gap:18px; flex-wrap:wrap}
.ringbox .lbl{font-size:13px; color:var(--muted); line-height:1.4; max-width:22ch}
.ringbox .lbl b{color:var(--ink); display:block; font-size:15px}

.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border-radius:12px; overflow:hidden; border:1px solid var(--border)}
@media (max-width:620px){ .kpis{grid-template-columns:1fr} }
.kpi{background:var(--surface); padding:14px 16px; display:flex; flex-direction:column; gap:4px}
.kpi .k{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.kpi .v{font-family:var(--mono); font-size:24px; font-weight:600; letter-spacing:-.02em}
.kpi .v small{font-size:14px; color:var(--muted); font-weight:500}
.kpi .d{font-size:13px; color:var(--ink2)}

.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{font-family:var(--mono); font-size:13px; min-width:38px; padding:6px 8px; border-radius:8px; border:1.5px solid var(--border);
  background:var(--surface); cursor:pointer; text-align:center; color:var(--muted); position:relative}
.chip.tgt{border-color:var(--dir); color:var(--ink)}
.chip.on{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.chip.on.tgt{box-shadow:0 0 0 2px var(--surface), 0 0 0 3.5px var(--dir)}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.sw{width:12px; height:12px; border-radius:3px; display:inline-block; border:1.5px solid var(--border)}

/* ---------- контрольные точки ---------- */
.cps{display:flex; flex-direction:column; gap:10px}
.qcard{display:grid; grid-template-columns:150px 1fr; border-left:4px solid var(--border2)}
.qcard.cur{border-left-color:var(--warn)}
.qcard.ok{border-left-color:var(--ok)}
.qcard.miss{border-left-color:var(--bad)}
.qcard .qh{padding:14px 16px; border-right:1px solid var(--border); display:flex; flex-direction:column; gap:4px}
.qcard .qh .ql{font-family:var(--serif); font-weight:600; font-size:16px}
.qcard .qb{padding:14px 16px; display:flex; flex-direction:column; gap:10px; min-width:0}
@media (max-width:620px){ .qcard{grid-template-columns:1fr} .qcard .qh{border-right:0; border-bottom:1px solid var(--border); flex-direction:row; flex-wrap:wrap; gap:4px 12px; align-items:baseline} }
.cpline{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; font-size:14px; padding:6px 0}
.cpline+.cpline{border-top:1px dashed var(--border)}
.cpline .lb{min-width:0}
.cpline .lb small{display:block; color:var(--muted); font-size:12.5px}
.score{font-family:var(--mono); font-weight:600; font-size:14px; white-space:nowrap; text-align:right}
.score small{display:block; font-weight:400; color:var(--muted); font-size:11.5px}
.dot{width:10px; height:10px; border-radius:50%; background:var(--border2); display:inline-block}
.dot.ok{background:var(--ok)} .dot.miss{background:var(--bad)} .dot.cur{background:var(--warn)}
.modchips{display:flex; flex-wrap:wrap; gap:6px}
.modchip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; border:1px solid var(--border); border-radius:999px; padding:2px 10px 2px 8px; color:var(--ink2)}
.modchip i{width:8px; height:8px; border-radius:50%; background:var(--m); display:inline-block}
.modchip b{font-family:var(--mono); font-weight:600; color:var(--ink)}

/* ---------- графики ---------- */
.chartbox{padding:16px 14px 10px}
.chartbox svg{display:block; max-width:100%}
.chartbox .legend{padding:6px 8px 4px}
.lg-line{width:20px; height:0; border-top:2.5px solid var(--dir); display:inline-block}
.lg-dash{width:20px; height:0; border-top:2px dashed var(--muted); display:inline-block}
.charts2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media (max-width:860px){ .charts2{grid-template-columns:1fr} }

/* ---------- темы ---------- */
.blocks{display:flex; flex-direction:column; gap:10px}
.block{--m:var(--dir); overflow:hidden}
.bhead{width:100%; display:flex; align-items:center; gap:12px; padding:13px 16px; background:none; border:0; border-left:4px solid var(--m); cursor:pointer; text-align:left}
@media (hover:hover){ .bhead:hover{background:var(--surface2)} }
.bhead .chev{color:var(--muted); font-size:11px; transition:transform .2s; width:12px}
.block.open .chev{transform:rotate(90deg)}
.bhead .bt{flex:1; min-width:0}
.bhead .bt b{font-family:var(--serif); font-size:16.5px; display:block}
.bhead .bt small{font-size:12.5px; color:var(--muted)}
.bhead .cnt{font-family:var(--mono); font-size:13px; font-weight:600; color:var(--m); white-space:nowrap}
.bhead .bar{width:70px; flex:none}
.bhead .bar>i{background:var(--m)}
@media (max-width:620px){ .bhead .bar{display:none} }
.bbody{display:none; padding:4px 14px 12px 18px}
.block.open .bbody{display:block}
.topic{display:flex; gap:11px; padding:9px 4px; align-items:flex-start; cursor:pointer; border-radius:8px}
@media (hover:hover){ .topic:hover{background:var(--surface2)} }
.topic input{appearance:none; -webkit-appearance:none; flex:none; width:20px; height:20px; margin:1px 0 0; cursor:pointer; border:1.5px solid var(--border2); border-radius:6px; background:var(--surface); position:relative}
.topic input:checked{background:var(--m); border-color:var(--m)}
.topic input:checked::after{content:""; position:absolute; left:6px; top:2px; width:5px; height:10px; border:solid var(--surface); border-width:0 2px 2px 0; transform:rotate(43deg)}
.topic .tx{font-size:14.5px; line-height:1.45; flex:1}
.topic .dt{font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap; padding-top:3px}
.topic.done .tx{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--border2)}

/* ---------- результаты ---------- */
.results{display:flex; flex-direction:column}
.res{display:grid; grid-template-columns:84px 1fr 130px auto; gap:12px; align-items:center; padding:9px 2px; font-size:14px}
.res+.res{border-top:1px solid var(--border)}
.res .rd{font-family:var(--mono); font-size:12.5px; color:var(--muted)}
.res .rl small{display:block; color:var(--muted); font-size:12.5px}
.rbar{height:18px; border-radius:5px; background:var(--surface2); position:relative; overflow:hidden}
.rbar>i{display:block; height:100%; background:var(--ok); opacity:.85}
.rbar>u{position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--warn)}
@media (max-width:620px){ .res{grid-template-columns:70px 1fr auto} .res .rbar{grid-column:1/-1; order:5} }
.empty{font-size:14px; color:var(--muted); padding:6px 0}

/* ---------- тьюторство ---------- */
.lvl{padding:18px 20px; display:flex; flex-direction:column; gap:12px; justify-content:center}
.lvl .big{display:flex; align-items:baseline; gap:10px}
.lvl .big b{font-family:var(--mono); font-size:44px; line-height:1; color:var(--dir)}
.lvl .big span{font-size:14px; color:var(--muted)}
.lvl .bar{height:9px}
.lvl .xp{font-family:var(--mono); font-size:12px; color:var(--muted)}
.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.badge{padding:12px; display:flex; gap:10px; align-items:center; border-radius:12px; border:1px solid var(--border); background:var(--surface)}
.badge .ic{width:38px; height:38px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; background:var(--surface2); filter:grayscale(1); opacity:.5}
.badge.got .ic{background:var(--dir-soft); filter:none; opacity:1}
.badge b{font-size:13.5px; display:block; line-height:1.25}
.badge small{font-size:12px; color:var(--muted); line-height:1.3; display:block}
.badge:not(.got) b{color:var(--muted)}

.spheres{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; align-items:start}
@media (max-width:900px){ .spheres{grid-template-columns:1fr} }
.sphere{display:flex; flex-direction:column; gap:10px}
.sphere-h{display:flex; align-items:center; gap:10px; padding:0 2px}
.sphere-h .ic{width:30px; height:30px; border-radius:9px; background:var(--s); color:var(--surface); display:flex; align-items:center; justify-content:center; font-size:15px}
.sphere-h h3{flex:1; font-size:17px}
.goal{--s:var(--dir); padding:14px 15px; display:flex; flex-direction:column; gap:11px; border-top:3px solid var(--s)}
.goal.done{opacity:.8}
.goal .gt{display:flex; gap:8px; align-items:flex-start}
.goal .gt h3{flex:1; font-size:15.5px}
.goal .gmeta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:12.5px; color:var(--muted)}
.goal .gnote{font-size:13px; color:var(--ink2)}
.goal .bar>i{background:var(--s)}
.goal .pc{font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--s)}
.gsec{border-top:1px solid var(--border); padding-top:10px; display:flex; flex-direction:column; gap:8px}
.gsec .gsh{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; font-family:var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.metric-now{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
.metric-now b{font-family:var(--mono); font-size:22px; color:var(--ink)}
.minirow{display:flex; gap:6px}
.minirow input{flex:1}
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.wd{display:flex; flex-direction:column; align-items:center; gap:3px; font-family:var(--mono); font-size:10px; color:var(--muted); text-transform:uppercase}
.mark{width:100%; aspect-ratio:1; max-width:38px; min-height:30px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface); cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:var(--muted)}
.mark.y{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.mark.n{background:var(--bad-soft); border-color:var(--bad); color:var(--bad)}

.task input{appearance:none; -webkit-appearance:none; flex:none; width:18px; height:18px; margin:1px 0 0; border:1.5px solid var(--border2); border-radius:5px; background:var(--surface); position:relative; cursor:pointer}
.task input:checked{background:var(--s); border-color:var(--s)}
.task input:checked::after{content:""; position:absolute; left:5px; top:1px; width:4px; height:9px; border:solid var(--surface); border-width:0 2px 2px 0; transform:rotate(43deg)}
.task .tx{flex:1; min-width:0; word-break:break-word}
.task.done .tx{color:var(--muted); text-decoration:line-through}
.task .due{font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap; padding-top:2px}
.task .due.late{color:var(--bad)}
.task .iconbtn{width:24px; height:24px; font-size:12px; opacity:.6}
.addgoal{border:1.5px dashed var(--border2); border-radius:14px; background:none; padding:16px; color:var(--muted); cursor:pointer; font-size:14px; text-align:center}

/* календарь */

.cal{padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px}
.cal-head{display:flex; align-items:center; justify-content:space-between}
.cal-title{font-family:var(--serif); font-weight:600; font-size:17px}
.grid7{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
.dow{font-family:var(--mono); font-size:10px; text-transform:uppercase; color:var(--muted); text-align:center; padding-bottom:2px}
.day{min-height:44px; border-radius:9px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-family:var(--mono); font-size:13px; color:var(--ink2); cursor:pointer; position:relative; border:1.5px solid transparent}
.day.out{visibility:hidden}
.day.today{border-color:var(--warn)}
.day.sel{background:var(--surface2); border-color:var(--dir)}

.dayp .hrow{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--border)}
.dayp .hrow .nm{flex:1; font-size:14px}
.dayp .hrow .nm small{display:block; color:var(--muted); font-size:12px}
.tri{display:flex; gap:4px}
.tri button{width:36px; height:32px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface); cursor:pointer; font-weight:700; color:var(--muted)}
.tri button.y.on{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.tri button.n.on{background:var(--bad-soft); border-color:var(--bad); color:var(--bad)}

.tools select{flex:0 1 220px; width:auto}
.seg{display:inline-flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--surface)}
.seg button{border:0; background:none; padding:7px 13px; font-size:14px; cursor:pointer; color:var(--muted)}
.seg button.on{background:var(--surface2); color:var(--ink); font-weight:600}
.terms{display:flex; flex-direction:column}
.term{display:grid; grid-template-columns:1fr auto; gap:4px 10px; padding:12px 4px; align-items:start}
.term+.term{border-top:1px solid var(--border)}
.term .tt{font-weight:600; font-size:15px}

.term.known .tt{color:var(--ok)}

.flash .fh{font-size:12.5px; color:var(--muted)}
.fctl{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}

.mbox{width:100%; max-width:560px; background:var(--surface); border-radius:16px; border:1px solid var(--border); box-shadow:0 20px 60px -20px rgba(0,0,0,.5); padding:20px 22px; display:flex; flex-direction:column; gap:14px}

.mfoot{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}
.mfoot .sp{flex:1}

.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

.foot{display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); align-items:center}

mark{background:var(--warn-soft); color:inherit; border-radius:3px; padding:0 1px}

{"t":"Мораль","d":"Совокупность особых, духовных правил, регулирующих поведение человека, его отношение к другим людям, к самому себе, а также к окружающей среде","m":"dk"},
{"t":"Нравственность","d":"Совокупность людских нравов, которая связана с практическим поведением людей дома, в семье, на работе, на отдыхе","m":"dk"},
{"t":"Совесть","d":"Способность личности осуществлять моральный самоконтроль, самостоятельно формулировать для себя нравственные обязанности","m":"dk"},
{"t":"Гуманизм","d":"Принцип морали, в основе которого лежит убеждение в безграничности возможностей человека и его способности к самосовершенствованию, требование свободы и защиты достоинства личности, идея о праве человека на счастье","m":"dk"},
{"t":"Патриотизм","d":"Чувство любви и преданности Родине, Отечеству, своему народу, вера в его духовные возможности, готовность служить интересам своей Родины","m":"dk"},
{"t":"Гражданственность","d":"Степень осознания себя гражданином своей страны и соответствующее этому поведение, готовность личности активно содействовать процветанию общества","m":"dk"},
{"t":"Экономика (как хозяйство)","d":"Хозяйство конкретной страны, включающее определённые отрасли и виды производства","m":"econ"},
{"t":"Экономика (как наука)","d":"Наука о законах развития хозяйства и способах его рационального ведения.","m":"econ"},
{"t":"Производство","d":"Процесс создания товаров и услуг, необходимых для существования человека, удовлетворения его потребностей","m":"econ"},
{"t":"Распределение","d":"Стадия экономической деятельности, на которой определяются пропорции, доли участия в разделе произведённого продукта","m":"econ"},
{"t":"Обмен","d":"Процесс, в котором взамен произведённого продукта люди получают деньги или другой продукт","m":"econ"},
{"t":"Потребление","d":"Стадия экономической деятельности, на которой результаты производства используются для удовлетворения личных и общественных потребностей","m":"econ"},
{"t":"Товар","d":"Вещь, продукт труда, предназначенная не для собственного потребления, а для потребления другими через обмен, куплю-продажу","m":"econ"},
{"t":"Услуга","d":"Результат полезной деятельности предприятий (организаций) и отдельных лиц, направленной на удовлетворение определённых потребностей населения и общества","m":"econ"},
{"t":"Ресурсы","d":"Совокупность природных, социальных и интеллектуальных сил, которые могут быть использованы для создания материальных благ и оказания услуг","m":"econ"},
{"t":"Блага","d":"Всё, что ценится людьми как средство удовлетворения их потребностей.","m":"econ"},
{"t":"Факторы производства","d":"Часть ресурсов, реально вовлечённых в производство экономических благ","m":"econ"},
{"t":"Экономическая система","d":"Организованные способы, механизмы и принципы распределения ограниченных ресурсов для удовлетворения потребностей людей","m":"econ"},
{"t":"Традиционная экономическая система","d":"Экономическая система с натуральной формой хозяйствования, в которой производство материальных благ и услуг осуществляется для удовлетворения собственных потребностей производителя","m":"econ"},
{"t":"Рыночная экономическая система","d":"Экономическая система, в которой решения о производстве, распределении и потреблении экономических благ принимаются самостоятельными экономическими субъектами на основе свободы выбора","m":"econ"},
{"t":"Централизованная экономическая система","d":"Экономическая система, в которой экономическая деятельность всех субъектов жёстко регламентируется из единого экономического центра в соответствии с государственным планом","m":"econ"},
{"t":"Смешанная экономическая система","d":"Экономическая система, при которой земля и капитал находятся в частной собственности, а распределение ограниченных ресурсов осуществляется как рынками, так и при значительном участии государства","m":"econ"},
{"t":"Собственность","d":"Обладание вещью или кем-либо как личным достоянием (в экономическом смысле) — отношение лица к принадлежащей ему вещи как своей.","m":"econ"},
{"t":"Национализация","d":"Переход от частной собственности в собственность государства или общества земли, промышленности, транспорта, банков и др","m":"econ"},
{"t":"Приватизация","d":"Приобретение государственного или муниципального имущества в частную собственность граждан, акционерных обществ","m":"econ"},
{"t":"Производство","d":"Процесс создания товаров и услуг, предназначенных для удовлетворения личных и общественных потребностей.","m":"econ"},
{"t":"Материальное производство","d":"Изготовление вещественных благ в отраслях промышленности, сельского хозяйства, строительства и т. д.","m":"econ"},
{"t":"Нематериальное производство","d":"Создание духовных и нравственных ценностей","m":"econ"},
{"t":"Экстенсивное производство","d":"За счёт количественного прироста ресурсов","m":"econ"},
{"t":"Интенсивное производство","d":"За счёт качественного улучшения факторов производства и повышения их эффективности","m":"econ"},
{"t":"Производительность труда","d":"Результативность труда, которая измеряется количеством продукции, произведённой в единицу времени (например, за день, месяц, год)","m":"econ"},
{"t":"Разделение труда","d":"Обособление качественно отличных видов трудовой деятельности в процессе совместного труда по функциональному, технологическому, профессиональному и квалификационному признакам","m":"econ"},
{"t":"Специализация","d":"Сосредоточение определённого вида деятельности в руках того человека или хозяйственной организации, которые справляются с нею лучше других","m":"econ"},
{"t":"Обмен","d":"Процесс, в котором взамен произведённого продукта люди получают деньги или другой продукт","m":"econ"},
{"t":"Рынок","d":"Экономические отношения, связанные с куплей-продажей товаров и услуг, в результате которых формируются спрос, предложение и цена","m":"econ"},
{"t":"Рыночный механизм","d":"Механизм формирования и распределения ресурсов, механизм взаимодействия продавцов и покупателей товаров по поводу установления цен и качества, объёма производства и его структуры","m":"econ"},
{"t":"Спрос","d":"Это желание и возможности потребителя приобрести конкретный товар или получить услугу","m":"econ"},
{"t":"Предложение","d":"Это желание и возможности производителя продать конкретный товар или услугу","m":"econ"},
{"t":"Конкуренция","d":"Экономическое соперничество участников хозяйственной деятельности в борьбе за достижение лучших результатов.","m":"econ"},
{"t":"Цена","d":"Это то количество денег, которое покупатель готов заплатить, а продавец желает получить за определённый товар (а точнее, за его единицу)","m":"econ"},
{"t":"Совершенная (чистая, свободная) конкуренция","d":"Рынок, на котором многочисленные, независимо действующие производители продают идентичную (стандартизированную) продукцию, причём ни один из них не в состоянии контролировать розничную цену","m":"econ"},
{"t":"Монополистическая конкуренция","d":"Рынок, на котором многочисленные продавцы продают схожие, но не идентичные товары","m":"econ"},
{"t":"Олигополия","d":"Рынок, на котором господствуют несколько крупных фирм, т. е. несколько продавцов противостоят множеству покупателей","m":"econ"},
{"t":"Чистая монополия","d":"Рынок, на котором есть только один продавец, т. е. один продавец противостоит множеству покупателей","m":"econ"},
{"t":"Предпринимательство","d":"Инициативная, самостоятельная, осуществляемая на свой риск и под свою имущественную ответственность деятельность человека, направленная на получение прибыли","m":"econ"},
{"t":"Юридическое лицо","d":"Организация, учреждение, фирма, выступающие в качестве единого, самостоятельного носителя прав и обязанностей","m":"econ"},
{"t":"Физическое лицо","d":"Человек, участвующий в экономической деятельности в качестве её полноценного субъекта: действует от собственного имени, может заниматься предпринимательством с момента государственной регистрации в качестве индивидуального предпринимателя","m":"econ"},
{"t":"Субъекты предпринимательства","d":"Частные лица, (граждане РФ, граждане иностранных государств, лица без гражданства). различные ассоциации (объединения, акционерные общества, арендные коллективы, коопераивы). Государство","m":"econ"},
{"t":"Объекты предпринимательства","d":"Любые виды хозяйственной деятельности","m":"econ"},
{"t":"Индивидуальное (частное) предпринимательство","d":"Предпринимательством занимается один человек. Оно основано на личной собственности его владельца, который получает весь доход и несёт неограниченную имущественную ответственность за результаты хозяйственной деятельности","m":"econ"},
{"t":"Хозяйственное товарищество (партнёрство)","d":"Предпринимательством занимаются два и более человек. Оно основано на долевой собственности и полной или частичной ответственности членов товарищества за результаты хозяйственной деятельности","m":"econ"},
{"t":"Хозяйственное общество (акционерное общество, корпорация, компания)","d":"Предпринимательством занимается совокупность лиц. Оно основано, как правило, на долевой собственности. Капитал общества образуется за счёт вкладов учредителей. Хозяйственное общество — это объединение капиталов","m":"econ"},
{"t":"Производственный кооператив (артель)","d":"Добровольное объединение граждан для совместной деятельности, основанной на их личном трудовом участии и объединении имущественных паёв","m":"econ"},
{"t":"Фермерское (крестьянское) хозяйство","d":"Объединение граждан, связанных родством и (или) свойством, имеющих в общей собственности имущество и совместно осуществляющих производственную и иную хозяйственную деятельность (производство, переработку, хранение, транспортировку и реализацию сельскохозяйственной продукции), основанную на их личном участии","m":"econ"},
{"t":"Свойство","d":"Отношения между родственниками супругов (тёща, тесть; свёкор, свекровь)","m":"econ"},
{"t":"Товарное хозяйство","d":"Хозяйство, при котором продукты производятся для продажи, а связь производителей и потребителей осуществляется посредством рынка.","m":"econ"},
{"t":"Натуральное хозяйство","d":"Хозяйство, в котором люди производят продукты лишь для удовлетворения своих собственных потребностей, не прибегая к обмену, к рынку.","m":"econ"},
{"t":"Деньги","d":"Товар, используемый в качестве мерила стоимости всех других товаров","m":"econ"},
{"t":"Сбережения","d":"Добровольный отказ от удовлетворения сегодняшних потребностей в пользу будущих.","m":"econ"},
{"t":"Денежная масса","d":"Это деньги, обращающиеся в данной стране","m":"econ"},
{"t":"Чек","d":"Приказ банку, выданный владельцем вклада, о выдаче со своего счёта денег лицу, указанному в чеке.","m":"econ"},
{"t":"Срочный счёт","d":"Вклад денежных средств в банк под про центы на определённый срок.","m":"econ"},
{"t":"Кредитные деньги","d":"Деньги, выступающие в виде соответствующих бумаг банкноты, чеки, векселя или в виде записей на счетах.","m":"econ"},
{"t":"Чековая книжка","d":"Определённое количество сброшюрованных бланков чеков, выдаваемых банком владельцу текущего банковского счёта","m":"econ"},
{"t":"Кредитная карточка","d":"Именной денежный доку мент, выпущенный банком или торговой фирмой, удостоверяющий личность владельца счёта в банке и дающий ему право на приобретение товаров и услуг в розничной торговле без оплаты наличными.","m":"econ"},
{"t":"Кредит","d":"Предоставление денег или товаров в долг, как правило, с уплатой процента.","m":"econ"},
{"t":"Вексель","d":"Письменное долговое обязательство, дающее его владельцу право по истечении срока обязательства требовать от должника уплаты обозначен ной денежной суммы.","m":"econ"},
{"t":"Инфляция","d":"Обесценение бумажных денег, проявляющееся в форме роста цен на товары и услуги, не обеспеченного повышением их качества","m":"econ"},
{"t":"Заработная плата","d":"Форма материального вознаграждения за труд (часть стоимости, созданной и реализованной продукции, услуг), поступающего наёмным работникам предприятий и учреждений","m":"econ"},
{"t":"Прожиточный минимум","d":"Уровень доходов, который необходим работнику для приобретения количества продуктов питания не ниже физиологических норм, а также для удовлетворения его потребностей (на самом необходимом уровне) в одежде, обуви, транс порте, оплате коммунальных услуг.","m":"econ"},
{"t":"Повременная зп","d":"Вознаграждение за труд в зависимости от проработанного времени и квалификации работника","m":"econ"},
{"t":"Сдельная зп","d":"Вознаграждение за труд в зависимости от количества и качества изготовленных изделий","m":"econ"},
{"t":"Номинальная зп","d":"Вознаграждение за труд, кото рое назначается работнику в виде определённой суммы денег","m":"econ"},
{"t":"Реальная зп","d":"Сумма жизненных благ, которую можно приобрести за номинальную плату при данном уровне цен на товары и услуги","m":"econ"},
{"t":"Стимулирование труда","d":"Внешнее влияние на поведение человека в сфере труда, способствующее росту его заинтересованности в труде.","m":"econ"},
{"t":"Доход (в широком смысле слова)","d":"Любой приток денежных средств или получение материальных ценностей, обладающих денежной стоимостью","m":"econ"},
{"t":"Социальная поддержка","d":"Осуществляемая в рамках социальной политики государства совокупность мероприятий, на правленных на выравнивание доходов и решение проблемы бедности","m":"econ"},
{"t":"Страхование","d":"Финансовое обеспечение от возможного ущерба.","m":"econ"},
{"t":"Налоги, уплачиваемые гражданами","d":"Определённая сумма де нег, которую гражданам необходимо уплатить государству","m":"econ"},
{"t":"Государственный бюджет (госбюджет)","d":"Документ, отражающий доходы и расходы государства.","m":"econ"},
{"t":"Прямые налоги","d":"Налоги, взимаемые непосредственно с какого-либо дохода или имущества в установленном размере","m":"econ"},
{"t":"Косвенные налоги","d":"Налоги на продажи товаров и услуг в виде надбавок к их цене","m":"econ"},
{"t":"Государственная пошлина","d":"Плата, взимаемая государством с граждан и хозяйственных организаций за оказание им определённого вида услуг","m":"econ"},
{"t":"Государственный долг","d":"Сумма задолженности государства по выпущенным и непогашенным займам, включая начисленные по ним проценты.","m":"econ"},
{"t":"Валютный (обменный) курс","d":"Цена одной национальной де нежной единицы, выраженная в денежных единицах других стран.","m":"econ"},
{"t":"Социальная структура общества","d":"Строение общества в целом, совокупность взаимосвязанных и взаимодействующих социальных групп, а также отношения между ними","m":"soc"},
{"t":"Социальные группы","d":"Любые совокупности людей, имеющие какой-либо общий социальнозначимый признак","m":"soc"},
{"t":"Социальные отношения","d":"Определённые устойчивые связи между людьми как представителями социальных групп","m":"soc"},
{"t":"Этнос","d":"Исторически сложившаяся на определённой территории общность людей, объединённых общностью языка, своеобразия культуры, быта, традиций, обычаев, само сознания","m":"soc"},
{"t":"Семья","d":"Малая социальная группа, основанная на браке и кров ном родстве, связанная общностью быта и взаимной ответственностью","m":"soc"},
{"t":"Традиционная (патриархальная) семья","d":"За супругами в соответствии с их полом закреплены определённые роли: жена выполняет роль матери и хозяйки, муж ответственен за материальное обеспечение, являясь главой семьи","m":"soc"},
{"t":"Коллективистская (партнёрская, демократическая) семья","d":"Все семейные роли рапределяются между мужем и женой фактически поровну. Решения по семейным вопросам принимаются совместно","m":"soc"},
{"t":"Психологический климат в семье","d":"Качественная сторона межличностных отношений, проявляющаяся в виде совокупности психологических условий, способствующих или препятствующих совместной продуктивной деятельности и всестороннему развитию личностей в семье","m":"soc"},
{"t":"Семейный долг","d":"Превращение нравственных требований, связанных с семейными отношениями, в личные правила, принятие их человеком как непременного условия отношения к окружающим","m":"soc"},
{"t":"Поколение","d":"Интервал времени между средним возрастом родителей и детей.","m":"soc"},
{"t":"Социальная роль","d":"Это то, что ожидается в данном обществе от всякого человека, занимающего определённое место в социальной системе","m":"soc"},
{"t":"Ролевой конфликт в подростковом возрасте","d":"Конфликт, связанный с выполнением подростком одной или нескольких социальных ролей, которые заключают в себе несовместимость, конфликтующие обязанности и требования","m":"soc"},
{"t":"Социальные ценности","d":"Определённые идеи, принципы, явления, предметы и их свойства с точки зрения их значения для человека или общества","m":"soc"},
{"t":"Социальные нормы","d":"Правила поведения людей, установленные и одобряемые всем обществом","m":"soc"},
{"t":"Отклоняющееся поведение","d":"Социальное поведение, не соответствующее имеющейся норме или набору норм, принятых значительной частью людей в группе или сообществе","m":"soc"},
{"t":"Социальный конфликт","d":"Столкновение противоположных общественных интересов, взглядов, стремлений, направлений общественного развития","m":"soc"},
{"t":"Социальный конфликт: внутриличностный","d":"Происходит внутри личности на уровне индивидуального сознания (Я реальное ↔ Я идеальное)","m":"soc"},
{"t":"Социальный конфликт: межличностный","d":"Происходит между двумя и более людьми одной или нескольких групп (Я ↔ Я)","m":"soc"},
{"t":"Социальный конфликт: межгрупповой","d":"Конфликт одной группы с другой [например, конфликт между различными классами, национальностями, религиозными и поколенческими (конфликт «отцов и детей») группами] (Мы ↔ Мы)","m":"soc"},
{"t":"Социальный конфликт: с внешней средой","d":"Давление на человека извне со стороны культурных, административных, экономических норм и предписаний, конфликт с организациями, поддерживающими эти нормы и предписания","m":"soc"},
{"t":"Социальный конфликт: охватывающий отдельные сферы общественной жизни","d":"Экономический (производственный), политический, этнический и др","m":"soc"},
{"t":"Социальный конфликт: охватывающий общество в целом","d":"Социальная революция — быстрый переход от одного общественно-политического строя к другому; война","m":"soc"},
{"t":"Межнациональные отношения","d":"Отношения между этносами (народами), охватывающие все сферы общественной жизни.","m":"soc"},
{"t":"Межнациональное сотрудничество","d":"Участие граждан различной национальной принадлежности, представителей национальных организаций, структур национальной государственности в общем деле, опирающееся на наличие устойчивых взаимовыгодных интересов","m":"soc"},
{"t":"Межнациональный конфликт","d":"Спор, столкновение, возникшее между большими группами людей разных национальностей, между государствами","m":"soc"},
{"t":"Нация","d":"Исторически устойчивая социально-экономическая и духовная общность людей","m":"soc"},
{"t":"Этническое меньшинство","d":"Группы людей какой-либо социально-этнической общности, проживающие за пределами своей государственности, в другой национальной среде и составляющие, как правило, меньшинство населения в странах своего проживания.","m":"soc"},
{"t":"Национализм","d":"Идеология и политика, ста вящие интересы нации пре выше любых других экономических, социальных, по литических интересов; стремление к национальной замкнутости, местничеству; недоверие к другим нациям, нередко перерастающее в межнациональную вражду","m":"soc"},
{"t":"Шовинизм","d":"Политическая и идеологическая система взглядов и действий, обосновывающая исключительность той или иной нации, противопоставление её интересов другим нациям и народам, внедряющих в сознание людей неприязнь, а зачастую и ненависть к другим народам, разжигающую вражду между людьми различных национальностей и вероисповеданий","m":"soc"},
{"t":"Геноцид","d":"Систематическое уничтожение отдельных групп на селения по расовым, национальным или религиозным признакам, а также создание жизненных условий, рас считанных на полное или частичное физическое уничтожение этих групп.","m":"soc"},
{"t":"Власть","d":"Способность, право и возможность распоряжаться кем-либо и чем-либо, оказывать решающее воздействие на поведение и деятельность людей","m":"pol"},
{"t":"Политическая власть","d":"Способность, право и возможность отстаивать и претворять в жизнь определённую политику, используя политические партии, организации, государство","m":"pol"},
{"t":"Политика","d":"Деятельность в политической сфере общества, на правленная на достижение, удержание, укрепление и реализацию власти","m":"pol"},
{"t":"Государство","d":"Организация политической власти, осуществляющая управление обществом, охрану его экономической и социальной структуры","m":"pol"},
{"t":"Суверенитет","d":"Верховенство государственной власти внутри страны (внутренний суверенитет) и её независимость во взаимоотношениях с другими государствами (внешний суверенитет)","m":"pol"},
{"t":"Функции государства","d":"Основные (главные) направления деятельности государства по реализации стоящих перед ним задач","m":"pol"},
{"t":"Внутренние функции","d":"Основные направления деятельности государства по управлению внутренний жизнью общества","m":"pol"},
{"t":"Внешние функции","d":"Основные направления деятельности государства на международной арене","m":"pol"},
{"t":"Государственная власть","d":"Форма политической власти, рас полагающая монопольным правом издавать законы, обязательные для всего населения, и опирающаяся на специальный аппарат принуждения как одно из средств соблюдения законов и распоряжений","m":"pol"},
{"t":"Компетенция","d":"Круг полномочий какого-либо учреждения или лица.","m":"pol"},
{"t":"Сбор","d":"Обязательный взнос, взимаемый с организаций и физических лиц, уплата которого — одно из условий совершения действий государственными органами, органами местного самоуправления в интересах плательщиков сборов, включая предоставление определённых прав или выдачу лицензии.","m":"pol"},
{"t":"Форма государства","d":"Устройство политической организации общества, призванное обеспечить её стабильность и нормальное функционирование","m":"pol"},
{"t":"Форма правления","d":"Организация высших органов власти.","m":"pol"},
{"t":"Монархия","d":"Форма правления, при которой верховная государственная власть сосредоточена в руках одного человека — монарха (главы государства): короля, царя, шаха, императора и т. д.— и передаётся по наследству","m":"pol"},
{"t":"Абсолютная (неограниченная) монархия","d":"Вся полнота власти — законодательной, исполнительной, судебной — сосредоточена в руках монарха, а её происхождение признаётся Божественным","m":"pol"},
{"t":"Ограниченная (конституционная, парламентская)","d":"Власть наследственного монарха ограничена конституцией страны или каким-либо представительным органом, чаще всего парламентом","m":"pol"},
{"t":"Республика","d":"От лат. respublica — общественное дело, государство. Форма правления, при которой высшая государственная власть принадлежит выбранным на определённый срок органам власти","m":"pol"},
{"t":"Президентская республика","d":"Очень большой властью наделён президент: он совмещает функции главы государства и правительства, формирует правительство; избирается прямым голосованием","m":"pol"},
{"t":"Парламентская республики","d":"Ведущим органом власти выступает избираемый гражданами парламент, который формирует правительство, отчитывающееся перед парламентом","m":"pol"},
{"t":"Смешанная (полупрезидентская) республика","d":"Власть президента значительна, но формирование правительства происходит с участием парламента","m":"pol"},
{"t":"Форма государственно-территориального (государственного) устройства","d":"Отношение между цен тральными и местными органами власти, распределение власти по территории страны","m":"pol"},
{"t":"Унитарное государство","d":"Единая политически однородная организация, состоящая из административно-территориальных единиц (губерний, краёв, провинций), не обладающих собственной государственностью. Существует единая конституция, система высших органов государственной власти, управления, судебная система","m":"pol"},
{"t":"Федерация","d":"Устойчивый союз административно территориальных единиц (штатов, земель, республик), самостоятельных в пределах распределённых между ними и центром полномочий, имеющих собственные законодательные, исполни тельные и судебные органы и, как-правило, конституцию, а часто и право на двойное гражданство","m":"pol"},
{"t":"Конфедерация","d":"Постоянный союз самостоятельных государств для осуществления совместных конкретных целей. Её члены полностью сохраняют государственный суверенитет и пере дают союзу решение ограниченного числа вопросов, чаще всего в оборонной области, в области внешней политики, транспорта и связи, де нежной системы","m":"pol"},
{"t":"Политический режим","d":"Совокупность методов, средств и приёмов осуществления политической власти, отражающая уровень политической свободы","m":"pol"},

{"t":"Идеология","d":"Система политических, правовых, нравственных, философских, религиозных, художественных взглядов и идей","m":"pol"},
{"t":"Демократический","d":"Политический режим, при ко тором народ или его большинство служит источником и носителем политической, государственной власти","m":"pol"},
{"t":"Авторитарный","d":"Политический режим, характеризующийся сосредоточением всей или почти всей власти у одного лица (монарха, диктатора) или правящей группы лиц и серьёзным ограничением, принижением и даже по давлением роли других, прежде всего представительных, органов, социальных и политических организаций, всего общества","m":"pol"},
{"t":"Тоталитарный","d":"Политический режим, при котором государство, политическая власть полностью подчиняют себе общество и личность, все стороны их жизни, подавляют права и свободы человека и гражданина насильственными методами","m":"pol"},
{"t":"Демократия","d":"Форма организации общества, при ко торой обеспечивается реальное участие личности в раз личных сферах общественной жизни, реализуется правление народа или действенный контроль за осуществлением власти со стороны народа","m":"pol"},
{"t":"Местное самоуправление (МСУ)","d":"Самостоятельная и под свою ответственность деятельность населения по решению вопросов местного значения: управление муниципальной (общественной) собственностью данной территории, организация коммунально-бытовых и социально-культурных услуг","m":"pol"},
{"t":"Политическое участие","d":"Действия гражданина с целью повлиять на принятие и реализацию государственных решений, выбор представителей в органы власти","m":"pol"},
{"t":"Политическая культура","d":"Совокупность политических знаний, отношений, ценностей, убеждений людей","m":"pol"},
{"t":"Выборы","d":"Процесс избрания путём голосования депутатов, должностных лиц, членов организации","m":"pol"},
{"t":"Предвыборная агитация","d":"Деятельность, имеющая целью побудить избирателей к участию в выборах, к голосованию за тех или иных кандидатов (те или иные списки кандидатов) или против них (в СМИ, посредством проведения митингов, шествий, публичных дебатов и дискуссий, посредством выпуска агитационных материалов и другими не запрещёнными законом средствами)","m":"pol"},
{"t":"Избирательное право граждан","d":"Конституционное право избирать и быть избранным в органы государственной власти и в выборные органы местного самоуправления","m":"pol"},
{"t":"Референдум","d":"Всенародное голосование граждан по наиболее важным вопросам государственного значения: законопроектам, действующим законам и др.","m":"pol"},
{"t":"Амнистия","d":"Частичное или полное освобождение осуждённых от наказания и его правовых последствий.","m":"pol"},
{"t":"Политическая партия","d":"Организованная группа единомышленников, выражающая интересы определённых социальных слоёв и стремящаяся к завоеванию государственной власти или участию в её осуществлении","m":"pol"},
{"t":"Партийная система","d":"Совокупность отношений между действующими в стране политическими партиями","m":"pol"},
{"t":"Политическое движение","d":"Общественное движение, преследующее политические цели, поддерживаемые его участниками","m":"pol"},
{"t":"Дискриминация","d":"Преднамеренное ущемление прав и свобод одних людей по сравнению с другими.","m":"pol"},
{"t":"Правовое государство","d":"Демократическое государство, организация и деятельность которого основаны на праве и связаны с правом, где созданы условия для наиболее полного обеспечения естественных и неотчуждаемых прав человека","m":"pol"},
{"t":"Гражданское общество","d":"Совокупность негосударственных общественных отношений и ассоциаций (объединений), выражающих разнообразные интересы и потребности членов общества","m":"pol"},
{"t":"Право","d":"Совокупность общеобязательных правил (норм), охраняемых силой государства","m":"law"},
{"t":"Норма права (правовая норма)","d":"Охраняемое государством общеобязательное правило, которое регулирует общественные отношения, поведение людей, устанавливая определённые права и обязанности","m":"law"},
{"t":"Нормативный правовой акт","d":"Правовой документ, из данный в особом процедурном порядке компетентным органом государственной власти, устанавливающий, из меняющий или отменяющий правила регулирования общественных отношений","m":"law"},
{"t":"Закон","d":"Это нормативный правовой акт","m":"law"},

{"t":"Субъекты (стороны) правоотношения","d":"Это участники правоотношения, обладающие взаимными правами и обязанностями","m":"law"},
{"t":"Объект правоотношения","d":"Это то, по поводу чего возникает правоотношение","m":"law"},
{"t":"Содержание правоотношения","d":"Субъективные юридические права и обязанности его участников","m":"law"},
{"t":"Отрасль права","d":"Большая группа (совокупность) правовых норм, которые регулируют целую сферу (т. е. область, раздел, круг) однородных, близких по своему характеру общественных отношений (например, конституционное (государственное) право, гражданское право, семейное право, трудовое право и др.)","m":"law"},
{"t":"Правоспособность","d":"Установленная государством и гарантированная нормами права способность обладать правами и нести юридические обязанности","m":"law"},
{"t":"Дееспособность","d":"Установленная государством и гарантированная нормами права способность своими действиями приобретать и осуществлять права и обязанности","m":"law"},
{"t":"Правонарушение","d":"Общественно опасное виновное деяние, противоречащее нормам права и наносящее вред обществу, государству или отдельным лицам, влекущее за собой юридическую ответственность","m":"law"},
{"t":"Деяние","d":"Действие или бездействие","m":"law"},

{"t":"Бездействие","d":"Пассивное поведение субъекта, неисполнение им своих обязанностей при возможности сделать это","m":"law"},
{"t":"Преступления","d":"Общественно опасные виновные деяния, предусмотренные уголовным законодательством","m":"law"},
{"t":"Проступки","d":"Виновные противоправные деяния, имеющие меньшую степень опасности по сравнению с преступлением","m":"law"},
{"t":"Дисциплинарные проступки (правонарушения)","d":"Нарушения трудовой, служебной, воинской, учебной дисциплины, противоправное виновное неисполнение своих трудовых обязанностей, нарушающее правила внутреннего распорядка","m":"law"},
{"t":"Гражданские проступки (правонарушения)","d":"Правонарушения, совершённые в сфере имущественных (невыполнение обязательств по договору, причинение имущественного вреда другому лицу и т. д.) и таких неимущественных отношений, которые представляют для человека ценность (достоинство, честь, деловая репутация и т.д.).","m":"law"},
{"t":"Административные проступки (правонарушения)","d":"Деяния, наносящие ущерб отношениям, складывающимся в сфере государственного управления (мелкое хулиганство, нарушение правил уличного движения, пожарной безопасности, санитарных правил и т. д.)","m":"law"},
{"t":"Юридическая ответственность","d":"Применение мер государственного принуждения к нарушителю за совершение противоправного деяния","m":"law"},

<script>
/* =====================================================================
   ЛОГИКА САЙТА
   ===================================================================== */
(function(){
"use strict";

/* ---------------- утилиты ---------------- */
var MONTHS_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
var MONTHS_SH  = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
var MONTHS_FULL= ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
var DOW = ["пн","вт","ср","чт","пт","сб","вс"];

function pad(n){ return (n<10?"0":"")+n; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function pd(s){ var p=String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function today(){ return TODAY_OVERRIDE || ymd(new Date()); }
function addDays(s,n){ var d=pd(s); d.setDate(d.getDate()+n); return ymd(d); }
function diffDays(a,b){ return Math.round((pd(b)-pd(a))/86400000); }
function fmt(s){ if(!s) return ""; var d=pd(s); return d.getDate()+" "+MONTHS_SH[d.getMonth()]; }
function fmtLong(s){ if(!s) return ""; var d=pd(s); return d.getDate()+" "+MONTHS_GEN[d.getMonth()]+" "+d.getFullYear(); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
function num(v){ if(v===""||v==null) return null; var n=parseFloat(String(v).replace(",",".")); return isNaN(n)?null:n; }
function plural(n, one, few, many){ var a=Math.abs(n)%100, b=a%10; if(a>10&&a<20) return many; if(b>1&&b<5) return few; if(b===1) return one; return many; }
function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function isDark(){ return document.documentElement.getAttribute("data-theme")==="dark" ||
  (document.documentElement.getAttribute("data-theme")!=="light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); }
function col(o){ return isDark() ? (o.dark||o.color) : o.color; }

var toastT;
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

/* ---------------- хранилище ---------------- */
var LS_KEY = "uchet-celey-v1";
var S, canSave = true;

function blank(){ return { v:1, tutor:{}, subj:{}, terms:{ added:[], edit:{}, hidden:{}, known:{} } }; }
function load(){
  var st=null;
  try { var raw=localStorage.getItem(LS_KEY); if(raw) st=JSON.parse(raw); } catch(e){ canSave=false; }
  S = st && typeof st==="object" ? st : blank();
  normalize();
}
function normalize(){
  var b=blank();
  Object.keys(b).forEach(function(k){ if(!S[k]) S[k]=b[k]; });
  ["added","edit","hidden","known"].forEach(function(k){ if(!S.terms[k]) S.terms[k]=b.terms[k]; });
  seed();
}
function freshRoot(){ var old=$("#app"), n=old.cloneNode(false); old.parentNode.replaceChild(n, old); return n; }
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); canSave=true; } catch(e){ canSave=false; }
  var el=$("#saveState"); if(el) el.textContent = canSave ? "сохранено в этом браузере · "+new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}) : "браузер не даёт сохранять (приватный режим?)";
}
function seed(){
  TUTOR_STUDENTS.forEach(function(st){
    if(!S.tutor[st.id]){
      S.tutor[st.id] = { goals:(TUTOR_SEED[st.id]||[]).map(function(g){
        var c=JSON.parse(JSON.stringify(g));
        c.id=uid(); c.status="active"; c.created=today();
        c.tasks=(c.tasks||[]).map(function(t){ return { id:uid(), text:t.text, due:t.due||"", done:null }; });
        return c;
      }) };
    }
  });
  SUBJ_STUDENTS.forEach(function(st){
    if(!S.subj[st.id]){
      S.subj[st.id] = { topics:{}, results:(st.seedResults||[]).map(function(r){ var c=JSON.parse(JSON.stringify(r)); c.id=uid(); c.cp=""; return c; }),
        skills:{}, cpEdit:{}, cpAdd:[], cpDel:{}, goalText:null };
    }
    var d=S.subj[st.id]; ["topics","skills","cpEdit","cpDel","topicDates"].forEach(function(k){ if(!d[k]) d[k]={}; }); if(!d.results) d.results=[]; if(!d.cpAdd) d.cpAdd=[];
  });
}

/* ---------------- модальное окно ---------------- */
function openModal(html, onMount){
  var m=$("#modal"); $("#mbox").innerHTML=html; m.hidden=false;
  document.body.style.overflow="hidden";
  var f=$("#mbox input, #mbox select, #mbox textarea"); if(f && window.innerWidth>700) setTimeout(function(){ f.focus(); }, 30);
  if(onMount) onMount($("#mbox"));
}
function closeModal(){ $("#modal").hidden=true; document.body.style.overflow=""; }
document.addEventListener("keydown", function(e){ if(e.key==="Escape" && !$("#modal").hidden) closeModal(); });
$("#modal").addEventListener("mousedown", function(e){ if(e.target.id==="modal") closeModal(); });

/* ---------------- маршрутизация ---------------- */
function route(){
  var h=location.hash.replace(/^#\/?/,"").split("/");
  var view=h[0]||"", id=h[1]||"";
  document.body.className="";
  $all(".navlinks a").forEach(function(a){ a.classList.toggle("on", a.getAttribute("data-r")===(view||"home")); });
  var root=$("#app");
  try {
    if(view==="t" && TUTOR_STUDENTS.some(function(s){return s.id===id;})) { document.body.className="d-tutor"; renderTutor(root, id); }
    else if(view==="s" && SUBJ_STUDENTS.some(function(s){return s.id===id;})) { var st=subjStudent(id); document.body.className="d-"+st.subject; renderSubj(root, st); }
    else if(view==="terms") { document.body.className="d-obsh"; renderTerms(root); }
    else { document.body.className="d-tutor"; renderHome(root); }
  } catch(err){
    root.innerHTML='<p class="failnote">Что-то сломалось при отрисовке: <code>'+esc(err && err.message)+'</code>. Покажи это сообщение — починю.</p>';
    if(window.console) console.error(err);
  }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

function subjStudent(id){ return SUBJ_STUDENTS.filter(function(s){ return s.id===id; })[0]; }
function tutorStudent(id){ return TUTOR_STUDENTS.filter(function(s){ return s.id===id; })[0]; }

/* =====================================================================
   ТЬЮТОРСТВО
   ===================================================================== */
function sphereById(id){ return SPHERES.filter(function(s){ return s.id===id; })[0] || SPHERES[0]; }

function metricInfo(g){
  var m=g.metric; if(!m) return null;
  var log=(m.log||[]).slice().sort(function(a,b){ return a.d<b.d?-1:a.d>b.d?1:0; });
  var cur, base, target;
  if(m.fromTasks){ cur=g.tasks.filter(function(t){return t.done;}).length; base=m.start||0; target=m.target; }
  else {
    cur = log.length ? log[log.length-1].v : null;
    base = m.start!=null ? m.start : (log.length ? log[0].v : null);
    target = m.target!=null ? m.target : (m.delta!=null && base!=null ? Math.round((base+m.delta)*100)/100 : null);
  }
  var p=null;
  if(cur!=null && base!=null && target!=null && target!==base) p=clamp((cur-base)/(target-base),0,1);
  else if(cur!=null && target!=null && target===base) p = 1;
  return { cur:cur, base:base, target:target, p:p, log:log };
}
function habitDays(h, from, to){ // список дат, в которые по плану нужна отметка
  var out=[], d=from;
  while(d<=to){
    var wd=(pd(d).getDay()+6)%7;
    if(h.mode==="daily" || (h.mode==="days" && (h.days||[]).indexOf(wd)>=0)) out.push(d);
    d=addDays(d,1);
  }
  return out;
}
function habitInfo(g){
  var h=g.habit; if(!h) return null;
  var marks=h.marks||{}, t=today();
  var yes=0, no=0; Object.keys(marks).forEach(function(k){ if(marks[k]===1) yes++; else if(marks[k]===-1) no++; });
  var p=null, start=g.created||t;
  var firstMark=Object.keys(marks).sort()[0]; if(firstMark && firstMark<start) start=firstMark;
  if(h.mode!=="free"){
    var from = diffDays(start,t)>29 ? addDays(t,-29) : start;
    var days=habitDays(h, from, t);
    // сегодняшний день не считаем пропуском, пока его не отметили
    var need=days.filter(function(d){ return d<t || marks[d]; });
    var done=need.filter(function(d){ return marks[d]===1; }).length;
    p = need.length ? done/need.length : null;
  } else {
    p = (yes+no) ? yes/(yes+no) : null;
  }
  // серия подряд
  var streak=0, d=t;
  if(marks[d]!==1) d=addDays(d,-1);
  if(h.mode==="free"){
    var keys=Object.keys(marks).filter(function(k){ return marks[k]!==0; }).sort().reverse();
    for(var i=0;i<keys.length;i++){ if(marks[keys[i]]===1) streak++; else break; }
  } else {
    for(var k=0;k<400;k++){
      var wd=(pd(d).getDay()+6)%7;
      var planned = h.mode==="daily" || (h.days||[]).indexOf(wd)>=0;
      if(planned){ if(marks[d]===1) streak++; else break; }
      d=addDays(d,-1);
    }
  }
  return { yes:yes, no:no, p:p, streak:streak };
}
function goalProgress(g){
  if(g.status==="done") return 1;
  var parts=[];
  var mi=metricInfo(g); if(mi && mi.p!=null) parts.push(mi.p);
  var hi=habitInfo(g); if(hi && hi.p!=null && g.habit.mode!=="free") parts.push(hi.p);
  if(g.tasks && g.tasks.length && !(g.metric && g.metric.fromTasks)) parts.push(g.tasks.filter(function(t){return t.done;}).length/g.tasks.length);
  if(!parts.length) return 0;
  return parts.reduce(function(a,b){return a+b;},0)/parts.length;
}

/* очки, уровни, достижения — считаются из отметок, их нельзя «накрутить» случайно */
function tutorStats(id){
  var goals=S.tutor[id].goals;
  var st={ habitYes:0, tasksDone:0, logs:0, goalsDone:0, goals:goals.length, spheres:{}, onTime:0, streakBest:0, dayStreak:0 };
  var dayYes={};
  goals.forEach(function(g){
    st.spheres[g.sphere]=1;
    if(g.status==="done"){ st.goalsDone++; if(g.deadline && g.doneAt && g.doneAt<=g.deadline) st.onTime++; }
    (g.tasks||[]).forEach(function(t){ if(t.done) st.tasksDone++; });
    if(g.metric && !g.metric.fromTasks) st.logs += (g.metric.log||[]).length;
    if(g.habit){ var m=g.habit.marks||{}; Object.keys(m).forEach(function(k){ if(m[k]===1){ st.habitYes++; dayYes[k]=1; } }); }
  });
  // лучшая серия дней, в которые была хоть одна выполненная привычка
  var days=Object.keys(dayYes).sort(), run=0, prev=null;
  days.forEach(function(d){ run = (prev && diffDays(prev,d)===1) ? run+1 : 1; st.streakBest=Math.max(st.streakBest,run); prev=d; });
  var t=today(), d=dayYes[t]?t:addDays(t,-1), s=0; while(dayYes[d]){ s++; d=addDays(d,-1); } st.dayStreak=s;
  st.xp = st.goals*10 + st.habitYes*10 + st.tasksDone*15 + st.logs*5 + st.goalsDone*100;
  var lvl=1, need=100, rest=st.xp;
  while(rest>=need){ rest-=need; lvl++; need=100+50*(lvl-1); }
  st.level=lvl; st.lvlXp=rest; st.lvlNeed=need;
  st.nSpheres=Object.keys(st.spheres).length;
  return st;
}

function goalCard(g, sp){
  var p=goalProgress(g), t=today();
  var dl='';
  if(g.deadline){
    var dd=diffDays(t,g.deadline);
    dl = g.status==="done" ? '<span class="tag ok">достигнута '+fmt(g.doneAt)+'</span>' :
      (dd<0 ? '<span class="tag bad">срок прошёл '+fmt(g.deadline)+'</span>' : '<span class="tag q">до '+fmt(g.deadline)+' · '+dd+' '+plural(dd,"день","дня","дней")+'</span>');
  } else if(g.status==="done") dl='<span class="tag ok">достигнута</span>';
  var h='<article class="panel goal'+(g.status==="done"?" done":"")+'" data-goal="'+g.id+'">'+
    '<div class="gt"><h3>'+esc(g.title)+'</h3><button class="iconbtn" data-edit-goal="'+g.id+'" title="Изменить" aria-label="Изменить цель">✎</button></div>'+
    '<div class="gmeta">'+dl+'<span class="pc">'+Math.round(p*100)+'%</span></div>'+
    '<div class="bar"><i style="width:'+Math.round(p*100)+'%"></i></div>'+
    (g.note?'<p class="gnote">'+esc(g.note)+'</p>':'');

  var mi=metricInfo(g);
  if(mi){
    var m=g.metric;
    h+='<div class="gsec"><div class="gsh"><span>'+esc(m.label||"Показатель")+'</span><span>'+
      (mi.base!=null?esc(fmtNum(mi.base)):'?')+' → '+(mi.target!=null?esc(fmtNum(mi.target)):(m.delta!=null?(m.delta>0?'+':'')+m.delta:'?'))+' '+esc(m.unit||"")+'</span></div>';
    h+='<div class="metric-now">'+(mi.cur!=null?'<b>'+esc(fmtNum(mi.cur))+'</b> '+esc(m.unit||""):'<span>пока нет замеров</span>')+
      (mi.cur!=null && mi.base!=null && !m.fromTasks && mi.log.length>1 ? ' · изменение '+signed(mi.cur-mi.base)+' '+esc(m.unit||""):'')+'</div>';
    if(!m.fromTasks){
      if(mi.log.length>1) h+=sparkline(mi.log, mi.target);
      h+='<form class="minirow" data-log="'+g.id+'"><input type="number" step="any" inputmode="decimal" placeholder="'+(mi.base==null?'стартовое значение':'новый замер')+'" aria-label="Новый замер"><button class="btn small" type="submit">Записать</button></form>';
      if(mi.log.length) h+='<div class="hstat">последний замер '+fmt(mi.log[mi.log.length-1].d)+' · всего '+mi.log.length+' <button class="iconbtn" style="width:22px;height:22px;font-size:11px" data-unlog="'+g.id+'" title="Удалить последний замер">↶</button></div>';
    } else {
      h+='<div class="hstat">считается по выполненным задачам ниже</div>';
    }
    h+='</div>';
  }
  var hi=habitInfo(g);

    for(var i=6;i>=0;i--){

    }

  }
  h+='<div class="gsec"><div class="gsh"><span>Задачи к цели</span><span>'+g.tasks.filter(function(x){return x.done;}).length+'/'+g.tasks.length+'</span></div><div class="tasks">';
  g.tasks.forEach(function(tk){
    var late = !tk.done && tk.due && tk.due<t;

function fmtNum(v){ return String(Math.round(v*100)/100).replace(".",","); }
function signed(v){ v=Math.round(v*100)/100; return (v>0?"+":v<0?"−":"")+String(Math.abs(v)).replace(".",","); }
function habitModeText(h){
  if(h.mode==="daily") return "каждый день";
  if(h.mode==="days") return (h.days||[]).map(function(d){return DOW[d];}).join(", ") || "дни не выбраны";
  return "когда было";
}
function sparkline(log, target){
  var W=260, H=58, pl=4, pr=4, pt=6, pb=6;
  var vals=log.map(function(x){return x.v;}); if(target!=null) vals.push(target);
  var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals); if(mn===mx){ mn-=1; mx+=1; }
  var t0=pd(log[0].d).getTime(), t1=pd(log[log.length-1].d).getTime(); if(t1===t0) t1=t0+86400000;
  var x=function(d){ return pl+(pd(d).getTime()-t0)/(t1-t0)*(W-pl-pr); };
  var y=function(v){ return pt+(1-(v-mn)/(mx-mn))*(H-pt-pb); };
  var s='<svg width="100%" height="'+H+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Динамика замеров">';
  if(target!=null) s+='<line x1="0" x2="'+W+'" y1="'+y(target).toFixed(1)+'" y2="'+y(target).toFixed(1)+'" stroke="var(--warn)" stroke-dasharray="4 4" stroke-width="1.5" vector-effect="non-scaling-stroke"/>';
  s+='<polyline fill="none" stroke="var(--s)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke" points="'+log.map(function(p){return x(p.d).toFixed(1)+","+y(p.v).toFixed(1);}).join(" ")+'"/>';
  s+='</svg>';
  return '<div title="Оранжевая линия — цель">'+s+'</div>';
}

  root.addEventListener("click", function(e){
    var el;

/* =====================================================================
   ПРЕДМЕТЫ (обществознание, история)
   ===================================================================== */
function modById(subj, id){ return subj.modules.filter(function(m){return m.id===id;})[0]; }
function monthEnd(i){ var ym=YEAR_MONTHS[i]; return ymd(new Date(ym[0], ym[1]+1, 0)); }
function monthStart(i){ var ym=YEAR_MONTHS[i]; return ymd(new Date(ym[0], ym[1], 1)); }
function quarterOf(date){ for(var i=0;i<QUARTERS.length;i++){ if(date<=QUARTERS[i].end) return i; } return QUARTERS.length-1; }
function secondary(subj, prim){ if(!subj.scale || prim==null) return null; return subj.scale[clamp(Math.round(prim),0,subj.scale.length-1)]; }
function primFor(subj, sec){ for(var i=0;i<subj.scale.length;i++){ if(subj.scale[i]>=sec) return i; } return subj.total; }

function topicPlan(st){ // [{id, mod, idx, text, month}]
  var subj=SUBJECTS[st.subject], out=[];
  st.plan.forEach(function(pl){
    var list=[]; pl.mods.forEach(function(mid){ var m=modById(subj,mid); m.topics.forEach(function(t,i){ list.push({ id:mid+"-"+i, mod:mid, idx:i, text:t }); }); });
    var span=pl.to-pl.from+1;
    list.forEach(function(t,i){ t.month = pl.from + Math.floor(i*span/list.length); out.push(t); });
  });
  var dates=(S.subj[st.id] && S.subj[st.id].topicDates) || {};
  out.forEach(function(t,i){
    t.num=i+1; t.date=dates[t.id]||"";
    if(t.date){ var mi=monthIdx(t.date); t.month=clamp(mi,0,YEAR_MONTHS.length-1); }
  });
  return out;
}
function nextTopic(st, plan){
  plan=plan||topicPlan(st); var d=S.subj[st.id];
  return plan.filter(function(x){ return !d.topics[x.id]; })[0] || null;
}
function topicWhen(x){
  if(x.date) return fmt(x.date);
  return "до "+MONTHS_SH[YEAR_MONTHS[x.month][1]];
}

function checkpoints(st){
  var subj=SUBJECTS[st.subject], d=S.subj[st.id], out=[];
  MONTHLY.forEach(function(mw){
    if(mw.entry){ out.push({ id:"m-"+mw.key, kind:"entry", fmt:"exam", date:mw.date, label:mw.label, total:null, parts:null, note:"Замер стартового уровня — цель не ставим." }); return; }
    var a=st.q[mw.between[0]-1], b=st.q[mw.between[1]-1];
    var parts=[Math.round((a.parts[0]+b.parts[0])/2), Math.round((a.parts[1]+b.parts[1])/2)];
    out.push({ id:"m-"+mw.key, kind:"month", fmt:"exam", date:mw.date, label:mw.label, total:parts[0]+parts[1], parts:parts, mods:a.mods, tasks:a.tasks,
      note:"Середина между целями "+QUARTERS[mw.between[0]-1].label+" и "+QUARTERS[mw.between[1]-1].label+"." });
  });
  st.q.forEach(function(q,i){
    out.push({ id:"q"+(i+1), kind:"quarter", fmt:"exam", date:QUARTERS[i].end, label:QUARTERS[i].label+(i===4?" — итоговая работа":" — четвертная работа"),
      total:q.total, parts:q.parts.slice(), mods:q.mods, tasks:q.tasks });
  });
  (st.modWorks||[]).forEach(function(mw,i){
    out.push({ id:"mw"+i, kind:"module", fmt:"module", date:mw.date, label:"Модульная: "+mw.mods.map(function(x){return modById(subj,x).name;}).join(" + "),
      targetPct:70, mods:mw.mods, note:mw.note||"Проверка усвоения раздела. Порог — 70%." });
  });
  out = out.filter(function(c){ return !d.cpDel[c.id]; }).map(function(c){
    var e=d.cpEdit[c.id]; if(!e) return c;
    var n={}; Object.keys(c).forEach(function(k){ n[k]=c[k]; }); Object.keys(e).forEach(function(k){ n[k]=e[k]; }); n.edited=true; return n;
  });
  d.cpAdd.forEach(function(c){ var n=JSON.parse(JSON.stringify(c)); n.custom=true; out.push(n); });
  out.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:(a.kind==="quarter")-(b.kind==="quarter"); });
  return out;
}
function resultFor(st, cp){ return S.subj[st.id].results.filter(function(r){ return r.cp===cp.id; }).sort(function(a,b){return a.date<b.date?1:-1;})[0]; }
function resPct(r){ if(r.fmt==="module"||r.kind==="module") return r.max ? r.total/r.max : null; return null; }
function cpStatus(st, cp){
  var r=resultFor(st, cp), t=today();
  if(r){
    if(cp.fmt==="module"){ var p=resPct(r); return p!=null && p*100>=cp.targetPct ? "ok" : "miss"; }
    if(cp.total==null) return "ok";
    return r.total>=cp.total ? "ok" : "miss";
  }
  return cp.date<t ? "late" : "wait";
}
